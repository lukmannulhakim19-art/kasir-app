<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Kasir</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-2xl border shadow-sm w-full max-w-sm p-8">
  <div class="text-center mb-8">
    <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
      <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
      </svg>
    </div>
    <h1 class="text-xl font-semibold text-gray-800">Aplikasi Kasir</h1>
    <p class="text-sm text-gray-400 mt-1">Silakan login untuk melanjutkan</p>
  </div>

  {% if error %}
  <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 mb-5">
    {{ error }}
  </div>
  {% endif %}

  <form method="POST" class="space-y-4">
    <div>
      <label class="text-sm font-medium text-gray-700 mb-1.5 block">Username</label>
      <input name="username" type="text" placeholder="owner / kasir" required autofocus
        class="w-full border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
    </div>
    <div>
      <label class="text-sm font-medium text-gray-700 mb-1.5 block">Password</label>
      <input name="password" type="password" placeholder="••••••••" required
        class="w-full border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
    </div>
    <button type="submit"
      class="w-full bg-blue-600 text-white rounded-lg py-2.5 text-sm font-semibold hover:bg-blue-700 transition mt-2">
      Masuk
    </button>
  </form>

  <div class="mt-6 bg-gray-50 rounded-lg p-3 text-xs text-gray-400 space-y-1">
    <p><span class="font-medium text-gray-500">owner</span> / owner123 → akses penuh</p>
    <p><span class="font-medium text-gray-500">kasir</span> / kasir123 → kasir saja</p>
  </div>
</div>
</body>
</html>
